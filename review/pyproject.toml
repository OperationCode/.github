[project]
name = "oc-review"
version = "0.1.0"
description = "OperationCode Claude PR review: collect, analyze and publish code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oc_review"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
