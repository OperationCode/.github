# Bad: workflow_call would let another workflow call eval.yml.
on: [workflow_dispatch, workflow_call]
permissions: {}
jobs:
  evals:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    env:
      EVAL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - run: echo evals
