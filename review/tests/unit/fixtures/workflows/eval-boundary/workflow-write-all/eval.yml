# Bad: write-all at workflow level, even with a correct job block.
on: workflow_dispatch
permissions: write-all
jobs:
  evals:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    env:
      EVAL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - run: echo evals
