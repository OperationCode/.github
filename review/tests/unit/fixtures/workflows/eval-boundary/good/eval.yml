# Good: eval.yml picks eval or eval-test with the fixed expression, sets EVAL_ENVIRONMENT
# from it, and its job states exactly contents: read and id-token: write.
on: workflow_dispatch
permissions: {}
jobs:
  evals:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    env:
      EVAL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - run: echo evals
