# Bad: no job-level permissions block, even though the workflow level has the right scopes.
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  select-environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - id: select
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "environment=eval" >> "$GITHUB_OUTPUT"
          else
            echo "environment=eval-test" >> "$GITHUB_OUTPUT"
          fi
  evals:
    needs: select-environment
    runs-on: ubuntu-24.04
    environment: ${{ needs.select-environment.outputs.environment }}
    env:
      EVAL_ENVIRONMENT: ${{ needs.select-environment.outputs.environment }}
    steps:
      - run: echo evals
