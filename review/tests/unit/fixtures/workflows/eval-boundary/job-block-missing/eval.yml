# Bad: no job-level permissions block, even though the workflow level has the right scopes.
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  evals:
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    env:
      EVAL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'eval' || 'eval-test' }}
    steps:
      - run: echo evals
