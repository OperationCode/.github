# Manual fixture evals against the live API (costs money; run on request only).
#
# workflow_dispatch only, on the branch to test: a dispatch run uses that
# branch's copy of this file and of the code. The job uses the `eval`
# environment, which needs the owner's approval for every run, and the eval
# federation rule binds the token to that environment. Only this file may use
# `eval`, and its job states contents: read and id-token: write and nothing
# else, so the job that holds the Anthropic credential has no GitHub write
# (spec "Fixture eval credential"; review/tests/unit/test_workflows.py).
#
# Harden-runner runs in audit mode (spec K-14). The allowlist is not measured
# for this job: it holds the hosts that the same checkout, setup-uv, uv sync
# and Anthropic token exchange and API steps reached in the V10 run of the
# central workflow. Measure it in audit mode before block mode (build plan,
# phase 5).

name: eval

on: workflow_dispatch

permissions: {}

jobs:
  fixture-evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: eval
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON: python3.12
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2, released 2026-10-19
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            files.pythonhosted.org:443
            api.anthropic.com:443
            *.actions.githubusercontent.com:443
      - name: Check out the dispatched branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, released 2026-07-20
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2, released 2026-10-22
        with:
          version: 0.13.1
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install the locked Python deps
        run: uv sync --locked --no-dev --project review
      - name: Run the fixture evals
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          PYTHONPATH: ${{ github.workspace }}/review/src
        run: >-
          uv run --no-sync --project review python -m oc_review.evals
          --fixtures-dir review/tests/fixtures
          --out-dir "$RUNNER_TEMP/eval"
