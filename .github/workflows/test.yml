# Unit tests on PRs to this repo and on pushes to main.
#
# This runs the PR's own code, with a read-only token, no id-token, no
# environment and no secrets (decision O11). It is not the review workflow.
# No path filter, so the required check never stays pending. The job name is
# the required check name: do not rename it.
#
# Harden-runner is in audit mode until the endpoints of this job are measured
# (live step L2); then egress-policy: block, disable-telemetry: true and the
# allowed-endpoints below.

name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_PYTHON: python3.12
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2, released 2026-10-19
        with:
          egress-policy: audit
          # BLOCK-MODE ALLOWLIST (L2): placeholder until measured.
          # Expected, to confirm: github.com:443 api.github.com:443
          # raw.githubusercontent.com:443 release-assets.githubusercontent.com:443
          # pypi.org:443 files.pythonhosted.org:443
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, released 2026-07-20
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0, released 2026-10-09
        with:
          version: 0.13.1
          checksum: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install the locked Python deps
        working-directory: review
        run: uv sync --locked
      - name: Run the unit tests
        working-directory: review
        run: uv run --locked pytest tests/unit
